[workspace]
resolver = "2"
members = [
    "crates/century-core",
    "crates/century-io",
    "crates/century-grid",
    "crates/century-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/century-rs/century-rs"
authors = ["century-rs Contributors"]
keywords = ["biogeochemistry", "soil-organic-matter", "century", "ecology", "simulation"]
categories = ["science", "simulation"]

[workspace.dependencies]
century-core = { path = "crates/century-core" }
century-io = { path = "crates/century-io" }
century-grid = { path = "crates/century-grid" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
wide = "0.7"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
