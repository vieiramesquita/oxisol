[workspace]
resolver = "2"
members = [
    "crates/oxisol-core",
    "crates/oxisol-io",
    "crates/oxisol-grid",
    "crates/oxisol-web",
    "crates/oxisol-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/oxisol/oxisol"
authors = ["Oxisol Contributors"]
keywords = ["biogeochemistry", "soil-organic-matter", "century", "ecology", "simulation"]
categories = ["science", "simulation"]

[workspace.dependencies]
oxisol-core = { path = "crates/oxisol-core" }
oxisol-io = { path = "crates/oxisol-io" }
oxisol-grid = { path = "crates/oxisol-grid" }
oxisol-web = { path = "crates/oxisol-web" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
wide = "0.7"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
