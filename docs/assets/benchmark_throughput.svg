  <text x="440" y="360" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11.5">Standalone 1T SIMD f32x8 SOM kernel: 8.88M cell-yr/s (106.6M cell-mo/s) · Zero unsafe code · MIT License</text>
